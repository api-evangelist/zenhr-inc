aid: zenhr-inc
name: ZenHR Inc
description: >-
  ZenHR is an AI-powered HR and payroll management platform (HRMS) serving businesses across the MENA
  region, with localization for Saudi Arabia, UAE, Egypt, Iraq, Jordan, and Kuwait (GOSI, WPS, social
  security, and local tax/labor laws). It provides automated payroll, attendance, employee self-service,
  performance management, and recruitment. ZenHR exposes a REST API (v3) that lets external applications
  integrate with branches, employees, master/professional/financial data, salaries, financial
  transactions, loans, overtime, time off, attendance, competencies, HR letters, terminations, business
  travel, and documents. The API responds in JSON, uses OAuth 2.0 (authorization code + PKCE), and is
  documented as a published Postman collection.
